name: CI and Deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://tffgvfovlpurxmkqkwwq.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_8QSMlpnBngYcAyStlUoG_g_qM-9y6Zm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build Vite bundle
        run: npm run build
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed Vite bundle
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            html="$(curl -fsSL --max-time 20 "${PAGE_URL}?sha=${GITHUB_SHA}" || true)"
            if printf '%s' "$html" | grep -q '/central-ai-platform/assets/' && ! printf '%s' "$html" | grep -q '/src/main.tsx'; then
              echo 'GitHub Pages is serving the built Vite bundle.'
              exit 0
            fi
            sleep 5
          done
          echo 'Deployment verification failed: Pages is not serving dist yet.' >&2
          exit 1
